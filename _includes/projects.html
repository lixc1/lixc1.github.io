<div class="project-grid">
{% for project in site.data.projects %}
  <article class="project-card"><p class="eyebrow">{{ project.category | escape }}</p><h3>{{ project.title | escape }}</h3><p>{{ project.description | escape }}</p><p class="project-tags">{{ project.tags | escape }}</p><a class="text-link" href="{{ project.link | escape }}">{{ project.link_label | escape }} <span aria-hidden="true">↗</span></a></article>
{% endfor %}
</div>
